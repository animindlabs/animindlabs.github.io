<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animind Labs</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050816;
overflow:hidden;
color:white;
}

/* Animated Background */

body::before{
content:"";
position:fixed;
width:250%;
height:250%;
background:
radial-gradient(circle,#00d9ff55 0%,transparent 25%),
radial-gradient(circle,#7c3aed55 0%,transparent 25%),
radial-gradient(circle,#00ff8855 0%,transparent 25%);
background-size:35% 35%;
animation:bgmove 25s linear infinite;
filter:blur(80px);
z-index:-2;
}

@keyframes bgmove{

0%{transform:translate(-10%,-10%) rotate(0deg);}
50%{transform:translate(-20%,-15%) rotate(180deg);}
100%{transform:translate(-10%,-10%) rotate(360deg);}

}

/* Particles */

.particle{
position:absolute;
background:white;
border-radius:50%;
opacity:.4;
animation:float linear infinite;
}

@keyframes float{

from{
transform:translateY(100vh);
}

to{
transform:translateY(-120vh);
}

}

.hero{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}

.card{

width:95%;
max-width:700px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.2);

backdrop-filter:blur(18px);

border-radius:30px;

padding:60px 40px;

text-align:center;

box-shadow:0 0 60px rgba(0,255,255,.2);

animation:fade 1.5s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

font-size:58px;
font-weight:700;

background:linear-gradient(90deg,#00d9ff,#00ff88,#7c3aed);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

margin-bottom:15px;

}

.tag{

font-size:22px;

opacity:.9;

margin-bottom:40px;

}

.btn{

display:inline-block;

padding:18px 42px;

border-radius:50px;

background:linear-gradient(90deg,#00d9ff,#7c3aed);

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

box-shadow:0 0 25px #00d9ff;

transition:.4s;

}

.btn:hover{

transform:translateY(-5px) scale(1.05);

box-shadow:0 0 40px cyan;

}

.features{

margin-top:45px;

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}

.box{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.06);

transition:.4s;

}

.box:hover{

background:rgba(255,255,255,.12);

transform:translateY(-6px);

}

footer{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

font-size:14px;

opacity:.6;

}

@media(max-width:700px){

.logo{
font-size:42px;
}

.features{

grid-template-columns:1fr;

}

.tag{
font-size:18px;
}

}

</style>

</head>

<body>

<div class="hero">

<div class="card">

<div class="logo">Animind Labs</div>

<div class="tag">
Learn in 10 Seconds 🚀
</div>

<a href="https://instagram.com/animindlabs" class="btn">
Follow on Instagram
</a>

<div class="features">

<div class="box">
🧪 Science Animations
</div>

<div class="box">
💻 Coding Tutorials
</div>

<div class="box">
📚 Quick Learning
</div>

<div class="box">
⚡ Premium Visuals
</div>

</div>

</div>

</div>

<footer>

© 2026 Animind Labs

</footer>

<script>

for(let i=0;i<120;i++){

let p=document.createElement("div");

p.className="particle";

let s=Math.random()*4+1;

p.style.width=s+"px";

p.style.height=s+"px";

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(Math.random()*10+8)+"s";

p.style.animationDelay=Math.random()*10+"s";

document.body.appendChild(p);

}

</script>

</body>
</html>
