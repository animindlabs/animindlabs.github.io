<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animind Labs</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050816;
overflow:hidden;
color:white;
}

/* Animated Background */

body::before{
content:"";
position:fixed;
width:250%;
height:250%;
background:
radial-gradient(circle,#00d9ff55 0%,transparent 25%),
radial-gradient(circle,#7c3aed55 0%,transparent 25%),
radial-gradient(circle,#00ff8855 0%,transparent 25%);
background-size:35% 35%;
animation:bgmove 25s linear infinite;
filter:blur(80px);
z-index:-2;
}

@keyframes bgmove{

0%{transform:translate(-10%,-10%) rotate(0deg);}
50%{transform:translate(-20%,-15%) rotate(180deg);}
100%{transform:translate(-10%,-10%) rotate(360deg);}

}

/* Particles */

.particle{
position:absolute;
background:white;
border-radius:50%;
opacity:.4;
animation:float linear infinite;
}

@keyframes float{

from{
transform:translateY(100vh);
}

to{
transform:translateY(-120vh);
}

}

.hero{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}

.card{

width:95%;
max-width:700px;

background:rgba(255,255,255,.08);
