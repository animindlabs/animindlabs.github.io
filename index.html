<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animind Labs</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:60px 20px;
background:linear-gradient(-45deg,#0f172a,#2563eb,#06b6d4,#9333ea);
background-size:400% 400%;
animation:bg 10s ease infinite;
overflow:hidden;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
padding:40px;
border-radius:25px;
text-align:center;
width:90%;
max-width:420px;
box-shadow:0 0 30px rgba(0,255,255,.3);
}

h1{
font-size:42px;
margin-bottom:10px;
}

p{
margin-bottom:25px;
color:#ddd;
}

a{
display:inline-block;
padding:14px 28px;
border-radius:50px;
background:#00d4ff;
color:#000;
text-decoration:none;
font-weight:bold;
box-shadow:0 0 20px #00d4ff;
transition:.3s;
}

a:hover{
transform:scale(1.08);
box-shadow:0 0 35px #00d4ff;
}
</style>
</head>

</body>
</html>
