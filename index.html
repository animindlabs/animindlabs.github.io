<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animind Labs</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{
background:#0b1120;
color:white;
overflow-x:hidden;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(10,10,20,.7);
backdrop-filter:blur(12px);
z-index:1000;
}

.logo{
font-size:30px;
font-weight:bold;
}

.logo span{
color:#00d4ff;
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav ul li a{
text-decoration:none;
color:white;
transition:.3s;
}

nav ul li a:hover{
color:#00d4ff;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:linear-gradient(-45deg,#08111f,#102a43,#0a4f70,#08111f);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
max-width:700px;
color:#d6d6d6;
margin-bottom:35px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#00d4ff;
color:black;
text-decoration:none;
border-radius:40px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 25px #00d4ff;
}

@media(max-width:768px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

nav{
padding:15px 5%;
}

nav ul{
gap:15px;
font-size:14px;
}

}
.about{
padding:100px 8%;
background:#111827;
}

.about h2{
font-size:42px;
text-align:center;
margin-bottom:20px;
}

.about p{
max-width:850px;
margin:0 auto;
text-align:center;
font-size:18px;
line-height:1.8;
color:#d1d5db;
}

.cards{
margin-top:60px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:18px;
backdrop-filter:blur(12px);
transition:0.3s;
border:1px solid rgba(255,255,255,0.08);
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px rgba(0,212,255,.35);
}

.card h3{
margin-bottom:12px;
color:#00d4ff;
}

.card p{
font-size:16px;
text-align:left;
  }
</style>

</head>

<body>

<nav>

<div class="logo">
Animind<span>Labs</span>
</div>

<ul>
<li><a href="#home">Home</a></li>
<li><a href="#animations">Animations</a></li>
<li><a href="#premium">Premium</a></li>
<li><a href="#instagram">Instagram</a></li>
<li><a href="#contact">Contact</a></li>
</ul>

</nav>

<section class="hero" id="home">

<h1>Learn in 10 Seconds 🚀</h1>

<p>
Premium Science Animations for Physics, Chemistry, Maths, Coding and AI.
</p>

<a class="btn" href="#animations">
Explore Animations
</a>

</section>

</body>
</html>
