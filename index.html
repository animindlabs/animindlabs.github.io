<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animind Labs</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:#090b17;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
position:relative;
background:linear-gradient(-45deg,#5b2cff,#00bfff,#00e5ff,#6a5cff);
background-size:400% 400%;
animation:bg 10s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
font-size:60px;
margin-bottom:15px;
animation:fade 1s ease;
}

p{
font-size:22px;
opacity:.9;
animation:fade 1.5s ease;
}

.btn{
display:inline-block;
margin-top:30px;
padding:16px 38px;
border-radius:50px;
background:white;
color:#111;
text-decoration:none;
font-weight:bold;
box-shadow:0 0 25px cyan;
transition:.3s;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 40px #00ffff;
}

.card{
width:90%;
max-width:900px;
margin:40px auto;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:20px;
padding:35px;
text-align:center;
box-shadow:0 0 20px rgba(255,255,255,.15);
animation:fadeUp 1s;
}

.card h2{
margin-bottom:15px;
}

footer{
padding:25px;
text-align:center;
background:#000;
margin-top:50px;
}

@keyframes fade{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(50px);}
to{opacity:1;transform:translateY(0);}
}

.particle{
position:absolute;
width:8px;
height:8px;
background:white;
border-radius:50%;
opacity:.8;
animation:float 12s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
10%{opacity:1;}
100%{
transform:translateY(-100px);
opacity:0;
}
}

@media(max-width:700px){
h1{font-size:40px;}
p{font-size:18px;}
}
</style>
</head>

<body>

<div class="hero">

<div>
<h1>Animind Labs</h1>
<p>Learn in 10 Seconds 🚀</p>

<a class="btn" href="https://instagram.com/animindlabs" target="_blank">
Follow on Instagram
</a>
</div>

</div>

<div class="card">
<h2>About</h2>
<p>
Premium educational animations, science tricks,
coding tutorials and concept videos.
</p>
</div>

<div class="card">
<h2>Subjects</h2>
<p>Physics • Chemistry • Maths • Coding • AI</p>
</div>

<div class="card">
<h2>Mission</h2>
<p>
Making learning visual, fun and memorable.
</p>
</div>

<footer>
© 2026 Animind Labs
</footer>

<script>
for(let i=0;i<80;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"%";
p.style.animationDuration=(6+Math.random()*8)+"s";
p.style.animationDelay=Math.random()*10+"s";
document.body.appendChild(p);
}
</script>

</body>
</html>
